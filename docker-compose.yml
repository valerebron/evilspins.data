services:
  evilspins-data:
    build: .
    image: evilspins-data
    container_name: evilspins.data
    restart: unless-stopped
    user: "0:0"
    environment:
      NODE_ENV: production
      VIRTUAL_HOST: "${DOMAIN}"
      LETSENCRYPT_HOST: "${DOMAIN}"
      MEDIA_DIR: "${MEDIA_DIR}"
      DATABASE_URL: "${DATABASE_URL}"
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - evilspins-db
    volumes:
      - /var/evilspins.media/:/var/evilspins.media/

  evilspins-db:
    image: postgres:15-alpine
    container_name: evilspins.db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "evilspins"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
    ports:
      - "${PORT_DB}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  default:
    name: dockerweb
    external: true
