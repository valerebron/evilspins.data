services:
  evilspins-data:
    build: .
    image: evilspins-data
    container_name: evilspins-data
    restart: unless-stopped
    environment:
      NODE_ENV: production
      VIRTUAL_HOST: "${DOMAIN}"
      LETSENCRYPT_HOST: "${DOMAIN}"
      CARDS_DIR: "${CARDS_DIR}"
      DATABASE_URL: "${DATABASE_URL}"
    ports:
      - "${PORT}:3000"
    depends_on:
      - evilspins-db
    volumes:
      - ./cards:/app/cards

  evilspins-db:
    image: postgres:15-alpine
    container_name: evilspins-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "evilspins"
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
    ports:
      - "${PORT_DB}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

networks:
  default:
    name: dockerweb
    external: true
