services:
  evilspins-db:
    image: postgres:15-alpine
    container_name: evilspins-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "evilspins"
      POSTGRES_PASSWORD: "password"
    ports:
      - "${PORT_DB}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: evilspins-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: evilspins-db
volumes:
  postgres_data:

networks:
  default:
    name: dockerweb
    external: true
